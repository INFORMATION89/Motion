name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Format and verify Kotlin
        run: |
          ./gradlew spotlessApply
          echo "MOTION_LAB_FORMATTED_BEGIN"
          base64 --wrap=0 motion-lab/src/main/kotlin/io/github/information89/motion/lab/MainActivity.kt
          echo
          echo "MOTION_LAB_FORMATTED_END"
          ./gradlew spotlessCheck

      - name: Unit tests
        run: ./gradlew :motion:testDebugUnitTest

      - name: Build the library
        run: ./gradlew :motion:assembleRelease

      - name: Build Motion Lab sample
        run: ./gradlew :motion-lab:assembleDebug
